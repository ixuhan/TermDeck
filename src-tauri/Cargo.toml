[package]
name = "termdeck"
version = "0.1.0"
description = "TermDeck - Windows enhanced workflow terminal"
authors = ["ixuhan"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "termdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
# thin LTO + 并行 codegen：编译时间约为 full LTO 的 1/3，产物略大但启动无感。
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
