[package]
name = "termdeck"
version = "0.3.1"
description = "TermDeck - Windows enhanced workflow terminal"
authors = ["ixuhan"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "termdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
# Auto-update: verifies the Ed25519 signature of the downloaded package
# against the public key compiled into the binary.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Enumerates COM ports through SetupAPI; display-only, never opened.
serialport = "4"
# Log file name templates (%Y%M%D%h%m%s) need local time formatting.
chrono = "0.4"

[target."cfg(windows)".dependencies]
# SetupAPI, only to read the friendlier device description that serialport omits.
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation"] }
# Real Explorer context menu (IContextMenu), so shell extensions show up too.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# No LTO on purpose. Thin LTO re-processes every dependency's codegen units on
# each build, which is what made a one-line frontend change cost 3-8 minutes.
# For a terminal the bottleneck is PTY I/O and rendering, not instruction count,
# so the trade (slightly larger binary, much faster rebuilds) is the right one.
# Need a squeezed binary for a real release? Override per build:
#   CARGO_PROFILE_RELEASE_LTO=thin scripts\build.bat
lto = false
codegen-units = 16
opt-level = "s"
strip = true
