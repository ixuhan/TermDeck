name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare build (disable updater if no signing key)
        shell: pwsh
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:SIGN_KEY -eq '') {
            $p = "src-tauri/tauri.conf.json"
            (Get-Content $p -Raw) -replace '"createUpdaterArtifacts":\s*true', '"createUpdaterArtifacts": false' | Set-Content $p -Encoding utf8 -NoNewline
            Write-Host "no signing key -> createUpdaterArtifacts=false"
          } else {
            Write-Host "signing key present -> keep updater artifacts"
          }

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater only accepts packages signed with this key. Losing it
          # means already-installed copies can never be updated again - keep a
          # backup outside the repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TermDeck ${{ github.ref_name }}
          releaseBody: |
            Windows 增强型工作流终端。详细改动见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md)。

            ## 下载哪个

            | 文件 | 说明 |
            |---|---|
            | `TermDeck_*_x64-setup.exe` | 安装版，带开始菜单与卸载项，推荐（支持自动更新） |
            | `TermDeck-*-portable.zip` | 便携版，解压即用，数据跟着文件夹走（手动更新） |

            安装版会在启动后自动检查新版本，也可以在「设置 → 关于与更新」里手动检查。
            `latest.json` 与 `.sig` 是自动更新的清单与签名，不需要手动下载。

            ## 系统要求

            - Windows 10 / 11 x64
            - WebView2 运行时（Win11 自带；Win10 若未安装，安装包会自动提示并引导下载）

            便携版解压后双击 `TermDeck.exe` 即可，首次运行会在同级目录创建 `data\`，
            历史、配置、日志都在里面；整个文件夹拷走就是迁移，删掉 `data\` 就是恢复出厂。
          releaseDraft: false
          prerelease: false

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          $stage = "release/TermDeck-$ver-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/termdeck.exe" "$stage/TermDeck.exe"
          Copy-Item "scripts/portable-readme.txt" "$stage/README-portable.txt"
          Copy-Item "README.md","LICENSE" $stage
          Compress-Archive -Path $stage -DestinationPath "release/TermDeck-$ver-portable.zip" -Force
          echo "PORTABLE_ZIP=release/TermDeck-$ver-portable.zip" >> $env:GITHUB_ENV

      - name: Upload portable zip to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} $env:PORTABLE_ZIP --clobber
